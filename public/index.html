<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>꼬마 포트리스</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1b2a; font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; color: #fff;
    user-select: none; -webkit-user-select: none; touch-action: none; overscroll-behavior: none; }
  #wrap { position: fixed; inset: 0; display: flex; justify-content: center; }
  #stage { position: relative; height: 100%; width: min(100vw, calc(100dvh * 0.5625)); }
  canvas { display: block; width: 100%; height: 100%; }
  #fireBox { position: absolute; right: 16px; bottom: calc(24px + env(safe-area-inset-bottom)); width: 120px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  #gauge { position: relative; width: 100%; height: 22px; border-radius: 11px; background: rgba(0,0,0,.55); border: 2px solid #fff; overflow: hidden; }
  #gaugeFill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, #4caf50, #ffeb3b 60%, #f44336); }
  #gaugeLast { position: absolute; top: 0; bottom: 0; width: 3px; background: #fff; left: -10px; box-shadow: 0 0 3px #000; }
  #gaugeText { position: absolute; inset: 0; text-align: center; font: 700 13px/18px system-ui; text-shadow: 0 1px 2px #000; }
  #fireBtn { width: 110px; height: 110px; border-radius: 50%; border: 5px solid #fff; background: radial-gradient(circle at 35% 30%, #ff8a65, #d32f2f 70%); color: #fff;
    font: 800 22px system-ui; box-shadow: 0 6px 0 #7f1d1d, 0 8px 16px rgba(0,0,0,.4); touch-action: none; }
  #fireBtn.pressed { transform: translateY(4px); box-shadow: 0 2px 0 #7f1d1d; }
  #fireBtn:disabled { filter: grayscale(1) brightness(.7); }
  #overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(13,27,42,.82); z-index: 5; padding: 16px; }
  #overlay.hidden { display: none; }
  .card { background: #1b263b; border: 3px solid #e0e1dd; border-radius: 18px; padding: 24px 20px; max-width: 340px; width: 100%; text-align: center; }
  .card h1 { margin: 0 0 8px; font-size: 28px; }
  .card p { margin: 8px 0; line-height: 1.5; color: #cfd8dc; }
  .card input { width: 100%; font-size: 18px; padding: 10px; border-radius: 10px; border: 2px solid #778da9; margin: 6px 0; background: #0d1b2a; color: #fff; user-select: text; -webkit-user-select: text; }
  .card button { margin-top: 12px; font: 700 20px system-ui; padding: 12px 28px; border-radius: 12px; border: none; background: #ffb703; color: #222; }
  .spin { display: inline-block; width: 28px; height: 28px; border: 4px solid #fff3; border-top-color: #ffb703; border-radius: 50%; animation: s 1s linear infinite; margin: 10px; }
  @keyframes s { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="cv"></canvas>
  <div id="fireBox">
    <div id="gauge"><div id="gaugeFill"></div><div id="gaugeLast"></div><div id="gaugeText">0</div></div>
    <button id="fireBtn" disabled>발사!</button>
  </div>
  <div id="overlay"><div class="card" id="card"></div></div>
</div></div>
<script src="shared.js"></script>
<script src="game.js"></script>
</body>
</html>
